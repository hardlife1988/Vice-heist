name: Build and Validate Vice Heist Math

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
    paths:
      - "math/**"
      - "tests/**"
      - "static/**"
      - "dist/**"
      - ".github/workflows/build-validate-math.yml"
  pull_request:
    paths:
      - "math/**"
      - "tests/**"
      - "static/**"
      - "dist/**"
      - ".github/workflows/build-validate-math.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install publish-book compression
        run: python -m pip install zstandard==0.25.0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/game.js
          node --check dist/game.js
      - name: Build calibrated bundle
        run: python math/build_stake_bundle.py
      - name: Validate generated bundle
        run: python math/validate_bundle.py
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Verify packaged game in the browser
        run: node tests/browser_smoke.cjs
      - name: Upload generated math for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vice-heist-calibrated-math
          path: |
            math/library/publish_files/
            dist/books_*.json
            dist/lookUpTable_*.csv
            dist/game_config.json
          if-no-files-found: error
