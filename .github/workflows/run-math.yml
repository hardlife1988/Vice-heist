name: Run Math SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test win evaluator
        run: python -m unittest discover -s tests -v

      - name: Build calibrated bundle
        run: python math/build_stake_bundle.py

      - name: Validate generated math bundle
        run: python math/validate_bundle.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone and set up Stake SDK
        run: |
          git clone https://github.com/StakeEngine/math-sdk.git
          cd math-sdk
          pip install -e .
          make setup

      - name: Run math entry point
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/math-sdk/src"
          cd math
          python3 run.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-output
          path: math/library/publish_files/
          if-no-files-found: warn
