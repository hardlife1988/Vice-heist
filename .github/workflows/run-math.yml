name: Verify Production Math
on:
  workflow_dispatch:
jobs:
  math:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python math/build_stake_bundle.py --release
      - run: python math/validate_bundle.py --publish release/math --release
      - run: python math/stress_published.py
      - name: Official SDK format checks
        run: |
          git clone https://github.com/engineio/math-sdk.git sdk-reference
          git -C sdk-reference checkout a6dccd86de740cc5d318079483cb6204cc5c19bc
          python math/sdk_verify.py --sdk sdk-reference
      - uses: actions/upload-artifact@v4
        with:
          name: vice-heist-production-candidate
          path: release/
          if-no-files-found: error
