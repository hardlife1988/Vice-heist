name: Build and Validate Vice Heist Math

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cyberpunk-assets
    paths:
      - "math/**"
      - "tests/**"
      - ".github/workflows/build-validate-math.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build calibrated bundle
        run: python math/build_stake_bundle.py
      - name: Validate generated bundle
        run: python math/validate_bundle.py
      - name: Upload generated math for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vice-heist-calibrated-math
          path: |
            math/library/publish_files/
            dist/books_*.json
            dist/lookUpTable_*.csv
            dist/game_config.json
          if-no-files-found: error
